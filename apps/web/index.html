<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Racing history simulator</title>
    <!-- The card a pasted link shows (WhatsApp, Discord, X...). Crawlers need an absolute image URL. -->
    <meta
      name="description"
      content="Re-live and re-race any season in motorsport history, and see how it could've played out differently."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://race-sim.clalegria.dev/" />
    <meta property="og:title" content="Rewrite motorsport history" />
    <meta
      property="og:description"
      content="Re-live and re-race any season in motorsport history, and see how it could've played out differently."
    />
    <meta property="og:image" content="https://race-sim.clalegria.dev/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The racing history simulator" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- The top nav's chequered flag, in the dark theme's primary and white. Inline, so no file to serve. -->
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 4 4' shape-rendering='crispEdges'><path fill='%23f5f3f0' d='M0 0h4v4H0z'/><path fill='%2348b7c0' d='M0 0h1v1H0zM2 0h1v1H2zM1 1h1v1H1zM3 1h1v1H3zM0 2h1v1H0zM2 2h1v1H2zM1 3h1v1H1zM3 3h1v1H3z'/></svg>"
    />
    <script>
      // Runs before first paint so a reader who chose light never sees a flash
      // of dark first. Dark is the default and needs no attribute, so this only
      // ever has to act on the stored choice.
      try {
        if (localStorage.getItem("alt-hist-theme") === "light") {
          document.documentElement.setAttribute("data-theme", "light");
        }
      } catch {
        // Storage can throw outright; the default theme is a fine answer.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
