# The checks on every push to main and every pull request, on a clean machine:
# what passes here passes without anything that only exists on one laptop.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes an older run's answer moot.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Takes pnpm's version from `packageManager` in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
